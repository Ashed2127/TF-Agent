<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Feed Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-card h3 {
      color: #666;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-card .value {
      color: #333;
      font-size: 2.5em;
      font-weight: bold;
    }

    .section {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .table th {
      background: #f8f9fa;
      font-weight: 600;
      color: #333;
    }

    .table tr:hover {
      background: #f8f9fa;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 500;
    }

    .badge-success {
      background: #d4edda;
      color: #155724;
    }

    .badge-warning {
      background: #fff3cd;
      color: #856404;
    }

    .badge-info {
      background: #d1ecf1;
      color: #0c5460;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.2em;
      padding: 50px;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 30px;
    }

    .refresh-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 True Feed Dashboard</h1>

    <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh</button>

    <div id="loading" class="loading">Loading dashboard...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="content" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Users</h3>
          <div class="value" id="totalUsers">0</div>
        </div>
        <div class="stat-card">
          <h3>Active Users</h3>
          <div class="value" id="activeUsers">0</div>
        </div>
        <div class="stat-card">
          <h3>Total Posts</h3>
          <div class="value" id="totalPosts">0</div>
        </div>
      </div>

      <div class="section">
        <h2>👥 Recent Users</h2>
        <table class="table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Channel</th>
              <th>Categories</th>
              <th>Posts</th>
              <th>Status</th>
              <th>Joined</th>
            </tr>
          </thead>
          <tbody id="usersTable">
          </tbody>
        </table>
      </div>

      <div class="section">
        <h2>📰 Recent Posts</h2>
        <table class="table">
          <thead>
            <tr>
              <th>User</th>
              <th>Channel</th>
              <th>Category</th>
              <th>Source</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="postsTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    async function loadDashboard() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const content = document.getElementById('content');

      loading.style.display = 'block';
      error.style.display = 'none';
      content.style.display = 'none';

      try {
        const result = await Telegram.WebApp.Serverless.call('dashboard', {});

        if (result.error) {
          throw new Error(result.error);
        }

        const data = result;

        // Update stats
        document.getElementById('totalUsers').textContent = data.users.total_users || 0;
        document.getElementById('activeUsers').textContent = data.users.active_users || 0;
        document.getElementById('totalPosts').textContent = data.users.total_posts || 0;

        // Update users table
        const usersTable = document.getElementById('usersTable');
        if (data.recentUsers && data.recentUsers.length > 0) {
          usersTable.innerHTML = data.recentUsers.map(user => `
            <tr>
              <td>${user.username || 'N/A'}</td>
              <td>${user.channel_name || user.channel_id || 'N/A'}</td>
              <td>${user.categories ? JSON.parse(user.categories).join(', ') : 'None'}</td>
              <td>${user.posts_count || 0}</td>
              <td><span class="badge badge-success">Active</span></td>
              <td>${new Date(user.created_at * 1000).toLocaleDateString()}</td>
            </tr>
          `).join('');
        } else {
          usersTable.innerHTML = '<tr><td colspan="6" class="empty">No users yet</td></tr>';
        }

        // Update posts table
        const postsTable = document.getElementById('postsTable');
        if (data.recentPosts && data.recentPosts.length > 0) {
          postsTable.innerHTML = data.recentPosts.map(post => `
            <tr>
              <td>User ID: ${post.user_id}</td>
              <td>${post.channel_id}</td>
              <td><span class="badge badge-info">${post.category}</span></td>
              <td>${post.source || 'N/A'}</td>
              <td>${new Date(post.created_at * 1000).toLocaleString()}</td>
            </tr>
          `).join('');
        } else {
          postsTable.innerHTML = '<tr><td colspan="5" class="empty">No posts yet</td></tr>';
        }

        loading.style.display = 'none';
        content.style.display = 'block';
      } catch (err) {
        console.error('Error loading dashboard:', err);
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = 'Failed to load dashboard: ' + err.message;
      }
    }

    // Load dashboard on page load
    loadDashboard();
  </script>
</body>
</html>
