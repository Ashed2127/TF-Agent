<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Creator Rankings & Leaderboard — TF</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #060908;
      --bg-surface: rgba(14, 22, 18, 0.78);
      --bg-surface-elevated: rgba(22, 36, 29, 0.9);
      --border-green: rgba(34, 197, 94, 0.22);
      --border-green-hover: rgba(34, 197, 94, 0.45);
      --green-primary: #10b981;
      --green-bright: #22c55e;
      --green-neon: #00ff87;
      --green-glow: rgba(0, 255, 135, 0.25);
      --amber-accent: #f59e0b;
      --purple-accent: #a855f7;
      --blue-accent: #3b82f6;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-black);
      background-image:
        radial-gradient(circle at 10% 5%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(245, 158, 11, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #060908 0%, #030403 100%);
      background-attachment: fixed;
      color: var(--text-white);
      min-height: 100vh;
      padding: 16px 14px 40px;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ─── Top Header ─── */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-green);
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #b45309, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
    }

    .brand-text h1 {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #fde68a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-refresh {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--border-green);
      color: var(--green-neon);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--green-neon);
    }

    .btn-refresh.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Caller Highlight Banner ─── */
    .user-highlight-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(245, 158, 11, 0.15));
      border: 1px solid rgba(0, 255, 135, 0.35);
      box-shadow: 0 8px 24px rgba(0, 255, 135, 0.12);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .user-highlight-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-rank-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #00ff87);
      color: #030403;
      font-weight: 800;
      font-size: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(0, 255, 135, 0.4);
    }

    .user-highlight-stats {
      display: flex;
      gap: 16px;
      text-align: right;
    }

    .stat-pill {
      display: flex;
      flex-direction: column;
    }

    .stat-pill .val {
      font-size: 1.15rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--green-neon);
    }

    .stat-pill .lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ─── Leaderboard Panel ─── */
    .panel-card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-green);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-green);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-white);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--green-neon);
      box-shadow: 0 0 12px rgba(0, 255, 135, 0.2);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-item {
      background: rgba(22, 36, 29, 0.5);
      border: 1px solid rgba(34, 197, 94, 0.15);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
    }

    .rank-item:hover {
      border-color: var(--border-green-hover);
      background: rgba(22, 36, 29, 0.8);
      transform: translateY(-1px);
    }

    .rank-item.is-you {
      border-color: var(--green-neon);
      background: rgba(16, 185, 129, 0.12);
      box-shadow: 0 0 16px rgba(0, 255, 135, 0.1);
    }

    .rank-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rank-num-wrap {
      min-width: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
    }

    .creator-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .creator-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .you-pill {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--green-neon);
      color: #040705;
      font-weight: 800;
      text-transform: uppercase;
    }

    .channel-link {
      color: var(--green-bright);
      text-decoration: none;
      font-size: 0.8rem;
    }

    .channel-link:hover {
      text-decoration: underline;
    }

    .item-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .badge-green { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.25); }
    .badge-blue { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.25); }
    .badge-purple { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.25); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.25); }

    .sub-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      color: var(--blue-accent);
      background: rgba(59, 130, 246, 0.12);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(34, 197, 94, 0.2);
      border-top-color: var(--green-neon);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Bar -->
    <header class="top-header">
      <div class="brand-wrap">
        <div class="brand-icon">🏆</div>
        <div class="brand-text">
          <h1>Creator Rankings</h1>
          <p>Live Leaderboard & Creator Activity</p>
        </div>
      </div>
      <button id="refreshBtn" class="btn-refresh" onclick="loadRankings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
        <span>Refresh</span>
      </button>
    </header>

    <!-- Caller My Rank Highlight Banner -->
    <div id="userHighlightCard" class="user-highlight-card">
      <div class="user-highlight-left">
        <div id="myRankCircle" class="user-rank-circle">#1</div>
        <div>
          <div style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--green-neon); font-weight: 700;">Your Position</div>
          <div id="myRankName" style="font-size: 1.1rem; font-weight: 800; color: #fff;">Channel</div>
          <div id="myRankChannel" style="font-size: 0.78rem; color: var(--text-muted);">Channel: @channel</div>
        </div>
      </div>
      <div class="user-highlight-stats">
        <div class="stat-pill">
          <span class="val" id="myRankPosts">0</span>
          <span class="lbl">Posts</span>
        </div>
        <div class="stat-pill">
          <span class="val" id="myRankActions">0</span>
          <span class="lbl">Actions</span>
        </div>
      </div>
    </div>

    <!-- Main Leaderboard Panel -->
    <div class="panel-card">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--amber-accent)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Content Creators Leaderboard
        </div>
        <span class="badge badge-amber" id="totalRankedBadge">0 Creators</span>
      </div>

      <input type="text" id="searchInput" class="search-input" placeholder="Search by channel or ID..." oninput="handleSearch(this.value)">

      <div id="loadingBox" class="loading-state">
        <div class="spinner"></div>
        <p>Fetching creator activity rankings...</p>
      </div>

      <div id="rankingsList" class="item-list" style="display: none;"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        if (tg.setHeaderColor) tg.setHeaderColor('#060908');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#060908');
      } catch (e) {}
    }

    let globalRankings = [];
    let callerTelegramId = null;
    let searchTerm = '';

    async function loadRankings() {
      const btn = document.getElementById('refreshBtn');
      const loading = document.getElementById('loadingBox');
      const listEl = document.getElementById('rankingsList');

      btn.classList.add('loading');

      try {
        let data = null;

        if (tg?.Serverless) {
          data = await new Promise((resolve, reject) => {
            tg.Serverless.call('creatorsRank', {}, (err, result) => {
              if (err) reject(err);
              else resolve(result);
            });
          });
        } else {
          const res = await fetch('/api/creatorsRank', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          }).catch(() => fetch('/api/creatorsRank'));

          if (res.ok) {
            data = await res.json();
          }
        }

        if (!data || !data.success) {
          throw new Error(data?.error || 'Failed to load rankings');
        }

        globalRankings = data.rankings || [];
        callerTelegramId = data.caller_telegram_id || tg?.initDataUnsafe?.user?.id || null;

        renderCallerHighlight();
        renderList();

        loading.style.display = 'none';
        listEl.style.display = 'flex';
      } catch (err) {
        console.error('Rankings load failed:', err);
        loading.innerHTML = `<p style="color: #fca5a5;">Sync Notice: ${escapeHtml(err.message)}</p><button class="btn-refresh" style="margin-top:10px;" onclick="loadRankings()">Retry</button>`;
      } finally {
        btn.classList.remove('loading');
      }
    }

    function renderCallerHighlight() {
      const card = document.getElementById('userHighlightCard');
      if (!callerTelegramId || globalRankings.length === 0) {
        card.style.display = 'none';
        return;
      }

      const myItem = globalRankings.find(r => r.telegram_id === callerTelegramId);
      if (!myItem) {
        card.style.display = 'none';
        return;
      }

      card.style.display = 'flex';
      document.getElementById('myRankCircle').textContent = `#${myItem.rank}`;
      const rawMyChannel = myItem.channel_name || myItem.channel_id || '';
      const myChannel = rawMyChannel
        ? (rawMyChannel.startsWith('@') || rawMyChannel.startsWith('-') ? rawMyChannel : `@${rawMyChannel}`)
        : 'No channel';
      document.getElementById('myRankName').textContent = myChannel;
      const mySubs = (myItem.subscribers !== null && myItem.subscribers !== undefined)
        ? `${myItem.subscribers.toLocaleString()} subscribers`
        : 'Content Creator';
      document.getElementById('myRankChannel').textContent = mySubs;
      document.getElementById('myRankPosts').textContent = myItem.total_posts || 0;
      document.getElementById('myRankActions').textContent = myItem.activities_count || 0;
    }

    function handleSearch(val) {
      searchTerm = (val || '').toLowerCase().trim();
      renderList();
    }

    function renderList() {
      const listEl = document.getElementById('rankingsList');
      const badge = document.getElementById('totalRankedBadge');
      if (!listEl) return;

      let list = globalRankings;
      if (badge) badge.textContent = `${list.length} Creators`;

      if (searchTerm) {
        list = list.filter(c => {
          const ch = (c.channel_name || c.channel_id || '').toLowerCase();
          const tgId = String(c.telegram_id);
          return ch.includes(searchTerm) || tgId.includes(searchTerm);
        });
      }

      if (list.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><p>No creators found matching search.</p></div>`;
        return;
      }

      listEl.innerHTML = list.map(c => {
        const isYou = callerTelegramId && (c.telegram_id === callerTelegramId);
        const rankNum = c.rank || 1;
        let medalHtml = `<span style="color: var(--text-muted); font-size: 0.95rem;">#${rankNum}</span>`;
        if (rankNum === 1) medalHtml = `🥇`;
        else if (rankNum === 2) medalHtml = `🥈`;
        else if (rankNum === 3) medalHtml = `🥉`;

        const ch = c.channel_name || c.channel_id;
        const isUsername = ch && !ch.startsWith('-');
        const chDisplay = isUsername ? (ch.startsWith('@') ? ch : `@${ch}`) : ch;
        const channelHtml = chDisplay
          ? (isUsername
              ? `<a href="https://t.me/${chDisplay.substring(1)}" target="_blank" class="channel-link">${escapeHtml(chDisplay)}</a>`
              : `<span class="channel-link">${escapeHtml(chDisplay)}</span>`)
          : '<span style="color: var(--text-dim);">No channel</span>';

        const subBadge = (c.subscribers !== null && c.subscribers !== undefined)
          ? `<span class="sub-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> ${c.subscribers.toLocaleString()} subs</span>`
          : '';

        return `
          <div class="rank-item ${isYou ? 'is-you' : ''}">
            <div class="rank-item-top">
              <div class="creator-info">
                <div class="rank-num-wrap">${medalHtml}</div>
                <div>
                  <div class="creator-name">
                    ${channelHtml}
                    ${isYou ? '<span class="you-pill">You</span>' : ''}
                  </div>
                  <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">
                    ${subBadge}
                  </div>
                </div>
              </div>
            </div>
            <div class="item-badges">
              <span class="badge badge-blue">📝 ${c.total_posts || 0} posts</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatTimeAgo(timestamp) {
      if (!timestamp) return 'Never';
      const sec = Math.floor((Date.now() - Number(timestamp)) / 1000);
      if (sec < 60) return 'Just now';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hrs = Math.floor(min / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    loadRankings();
  </script>
</body>
</html>
